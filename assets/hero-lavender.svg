<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340">
    <stop stop-color="#140F23"/><stop offset=".5" stop-color="#21153A"/><stop offset="1" stop-color="#2A1746"/>
  </linearGradient>
  <linearGradient id="glow" x1="220" y1="0" x2="980" y2="0">
    <stop stop-color="#A374FF"/><stop offset=".5" stop-color="#E1D6FF"/><stop offset="1" stop-color="#FF9CF4"/>
  </linearGradient>
  <radialGradient id="orb1"><stop stop-color="#CBAEFF" stop-opacity=".6"/><stop offset="1" stop-color="#CBAEFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb2"><stop stop-color="#FF9CF4" stop-opacity=".35"/><stop offset="1" stop-color="#FF9CF4" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#4B2F74" stroke-width="1" opacity=".35" fill="none"/>
  </pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="340" rx="24" fill="url(#bg)"/>
<rect width="1200" height="340" rx="24" fill="url(#grid)"/>

<circle cx="1020" cy="60" r="190" fill="url(#orb1)">
  <animate attributeName="cy" values="60;90;60" dur="10s" repeatCount="indefinite"/>
</circle>
<circle cx="170" cy="300" r="150" fill="url(#orb2)">
  <animate attributeName="cx" values="170;220;170" dur="9s" repeatCount="indefinite"/>
</circle>

<g stroke="url(#glow)" stroke-width="2" fill="none" opacity=".9" filter="url(#soft)">
  <path d="M70 90H310L380 150H520" stroke-dasharray="8 14">
    <animate attributeName="stroke-dashoffset" values="0;-60" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M1130 255H920L860 205H690" stroke-dasharray="8 14">
    <animate attributeName="stroke-dashoffset" values="0;60" dur="4.6s" repeatCount="indefinite"/>
  </path>
</g>

<g fill="#F7F1FF" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
  <text x="600" y="72" font-size="14" font-weight="700" letter-spacing="4" fill="#D9CCFF">NEON CONTROL ROOM // PROFILE ONLINE</text>
  <text x="600" y="155" font-size="60" font-weight="800" letter-spacing="4">LAMES KHALED</text>
  <text x="600" y="194" font-size="20" fill="#E8DCFF" letter-spacing="2">AI × AUTOMATION × ENTERPRISE SYSTEMS</text>
  <rect x="355" y="214" width="490" height="3" rx="1.5" fill="url(#glow)">
    <animate attributeName="x" values="355;410;355" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="490;380;490" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="252" font-size="15" font-weight="700" fill="#FFB3F7" letter-spacing="2">POWER PLATFORM · UIPATH · COPILOT STUDIO · CLOUD</text>
  <text x="600" y="287" font-size="13" fill="#D5C6F8" letter-spacing="2">building systems that think, act & scale</text>
</g>
</svg>