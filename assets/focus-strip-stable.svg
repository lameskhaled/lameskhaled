<svg width="900" height="100" viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg">

<defs>

    <!-- Animated Enterprise Background -->
    <linearGradient id="movingGlow" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#080A1F"/>
        <stop offset="35%" stop-color="#182253"/>
        <stop offset="50%" stop-color="#27357D"/>
        <stop offset="65%" stop-color="#182253"/>
        <stop offset="100%" stop-color="#080A1F"/>
    </linearGradient>

    <!-- Light Sweep -->
    <linearGradient id="shine" x1="0%" x2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="50%" stop-color="#5AE7FF" stop-opacity="1"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Glows -->
    <filter id="purpleGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#8A4CFF"/>
    </filter>

    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#D765FF"/>
    </filter>

    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#5AE7FF"/>
    </filter>

    <style>
        .label {
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 12px;
            font-weight: 700;
            fill: #F7F6FA;
            text-anchor: middle;
        }

        .box {
            fill: #111833;
            stroke-width: 1.5;
        }

        .automation { stroke: #5638D6; }
        .ai { stroke: #8A4CFF; }
        .digital { stroke: #D765FF; }
        .systems { stroke: #5AE7FF; }
    </style>

</defs>

<!-- Background -->
<rect width="900" height="100" rx="18" fill="#080A1F"/>

<!-- Moving Ambient Layer -->
<rect x="-300"
      y="0"
      width="1500"
      height="100"
      rx="18"
      fill="url(#movingGlow)"
      opacity="0.35">
    <animateTransform
        attributeName="transform"
        type="translate"
        values="-150 0;150 0;-150 0"
        dur="30s"
        repeatCount="indefinite"/>
</rect>

<!-- Premium Sweep -->
<rect x="-180"
      y="0"
      width="100"
      height="100"
      fill="url(#shine)"
      opacity="0.06">
    <animate
        attributeName="x"
        values="-180;980"
        dur="16s"
        repeatCount="indefinite"/>
</rect>

<!-- Outer Border -->
<rect x="1"
      y="1"
      width="898"
      height="98"
      rx="18"
      fill="none"
      stroke="#28346E"
      stroke-width="1.2"/>

<!-- Capability Boxes -->
<g>

    <!-- Intelligent Automation -->
    <g transform="translate(30 27)" filter="url(#purpleGlow)">
        <rect class="box automation"
              width="180"
              height="46"
              rx="10"/>
        <text class="label" x="90" y="29">
            INTELLIGENT AUTOMATION
        </text>
    </g>

    <!-- Enterprise AI -->
    <g transform="translate(235 27)" filter="url(#purpleGlow)">
        <rect class="box ai"
              width="165"
              height="46"
              rx="10"/>
        <text class="label" x="82.5" y="29">
            ENTERPRISE AI
        </text>
    </g>

    <!-- Digital Systems -->
    <g transform="translate(425 27)" filter="url(#pinkGlow)">
        <rect class="box digital"
              width="165"
              height="46"
              rx="10"/>
        <text class="label" x="82.5" y="29">
            DIGITAL SYSTEMS
        </text>
    </g>

    <!-- Systems Thinking -->
    <g transform="translate(615 27)" filter="url(#cyanGlow)">
        <rect class="box systems"
              width="220"
              height="46"
              rx="10"/>
        <text class="label" x="110" y="29">
            SYSTEMS THINKING
        </text>
    </g>

</g>

</svg>
