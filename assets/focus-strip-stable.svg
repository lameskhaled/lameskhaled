<svg width="900" height="260" viewBox="0 0 900 260"
     xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5638D6"/>
        <stop offset="50%" stop-color="#8A4CFF"/>
        <stop offset="100%" stop-color="#5AE7FF"/>
    </linearGradient>

    <filter id="glow">
        <feDropShadow dx="0" dy="0" stdDeviation="3"
                      flood-color="#8A4CFF"
                      flood-opacity="0.6"/>
    </filter>

    <style>
        .node-title{
            fill:#F7F6FA;
            font-family:Segoe UI,Arial,sans-serif;
            font-size:13px;
            font-weight:700;
            text-anchor:middle;
        }

        .node-sub{
            fill:#B8C0D7;
            font-family:Segoe UI,Arial,sans-serif;
            font-size:10px;
            text-anchor:middle;
        }
    </style>

</defs>

<!-- Background -->

<rect width="900"
      height="260"
      rx="18"
      fill="#080A1F"
      stroke="#28346E"/>

<!-- Connections -->

<path
    d="M280 130 C340 130,360 95,400 90"
    fill="none"
    stroke="url(#flow)"
    stroke-width="2.5"
    stroke-linecap="round"/>

<path
    d="M500 90 C560 95,585 130,620 130"
    fill="none"
    stroke="url(#flow)"
    stroke-width="2.5"
    stroke-linecap="round"/>

<path
    d="M450 135 C450 150,450 155,450 170"
    fill="none"
    stroke="url(#flow)"
    stroke-width="2.5"
    stroke-linecap="round"/>

<!-- Center Node -->

<g filter="url(#glow)">
    <circle cx="450"
            cy="90"
            r="52"
            fill="#111833"
            stroke="#8A4CFF"
            stroke-width="2"/>
</g>

<text class="node-title"
      x="450"
      y="85">
    ENTERPRISE AI
</text>

<text class="node-sub"
      x="450"
      y="105">
    Copilot Studio
</text>

<!-- Left Node -->

<g filter="url(#glow)">
    <circle cx="220"
            cy="130"
            r="58"
            fill="#111833"
            stroke="#5638D6"
            stroke-width="2"/>
</g>

<text class="node-title"
      x="220"
      y="125">
    AUTOMATION
</text>

<text class="node-sub"
      x="220"
      y="145">
    UiPath • Power Automate
</text>

<!-- Right Node -->

<g filter="url(#glow)">
    <circle cx="680"
            cy="130"
            r="58"
            fill="#111833"
            stroke="#D765FF"
            stroke-width="2"/>
</g>

<text class="node-title"
      x="680"
      y="125">
    DIGITAL SYSTEMS
</text>

<text class="node-sub"
      x="680"
      y="145">
    Apps • Integrations
</text>

<!-- Bottom Node -->

<g filter="url(#glow)">
    <circle cx="450"
            cy="200"
            r="58"
            fill="#111833"
            stroke="#5AE7FF"
            stroke-width="2"/>
</g>

<text class="node-title"
      x="450"
      y="195">
    SYSTEMS THINKING
</text>

<text class="node-sub"
      x="450"
      y="215">
    Strategy • Governance
</text>

</svg>
