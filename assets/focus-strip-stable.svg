<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#080A1F"/>
        <stop offset="100%" stop-color="#141B45"/>
    </linearGradient>

    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5638D6"/>
        <stop offset="50%" stop-color="#8A4CFF"/>
        <stop offset="100%" stop-color="#5AE7FF"/>
    </linearGradient>

    <filter id="softGlow">
        <feDropShadow dx="0" dy="0" stdDeviation="2"
            flood-color="#8A4CFF"
            flood-opacity="0.4"/>
    </filter>

    <style>
        .node {
            fill: #111833;
            stroke-width: 1.5;
            rx: 10;
        }

        .label {
            font-family: Segoe UI, Arial, sans-serif;
            font-size: 12px;
            font-weight: 700;
            fill: #F7F6FA;
            text-anchor: middle;
        }
    </style>

</defs>

<!-- Background -->

<rect width="900"
      height="120"
      rx="16"
      fill="url(#bg)"
      stroke="#28346E"/>

<!-- Smooth Connections -->

<path
    d="M200 60 C220 60, 230 45, 250 45"
    fill="none"
    stroke="url(#flow)"
    stroke-width="2"
    stroke-linecap="round"/>

<path
    d="M420 45 C450 45, 460 75, 480 75"
    fill="none"
    stroke="url(#flow)"
    stroke-width="2"
    stroke-linecap="round"/>

<path
    d="M650 75 C670 75, 680 60, 700 60"
    fill="none"
    stroke="url(#flow)"
    stroke-width="2"
    stroke-linecap="round"/>

<!-- Animated Flow -->

<path
    d="M200 60 C220 60, 230 45, 250 45"
    fill="none"
    stroke="#8A4CFF"
    stroke-width="3"
    stroke-dasharray="6 12"
    opacity=".8">

    <animate
        attributeName="stroke-dashoffset"
        values="0;-36"
        dur="3s"
        repeatCount="indefinite"/>
</path>

<path
    d="M420 45 C450 45, 460 75, 480 75"
    fill="none"
    stroke="#D765FF"
    stroke-width="3"
    stroke-dasharray="6 12"
    opacity=".8">

    <animate
        attributeName="stroke-dashoffset"
        values="0;-36"
        dur="3s"
        repeatCount="indefinite"/>
</path>

<path
    d="M650 75 C670 75, 680 60, 700 60"
    fill="none"
    stroke="#5AE7FF"
    stroke-width="3"
    stroke-dasharray="6 12"
    opacity=".8">

    <animate
        attributeName="stroke-dashoffset"
        values="0;-36"
        dur="3s"
        repeatCount="indefinite"/>
</path>

<!-- Capability Cards -->

<g filter="url(#softGlow)">

    <rect x="30"
          y="37"
          width="170"
          height="46"
          rx="10"
          fill="#111833"
          stroke="#5638D6"/>

    <text x="115"
          y="65"
          class="label">
        AUTOMATION
    </text>

    <rect x="250"
          y="22"
          width="170"
          height="46"
          rx="10"
          fill="#111833"
          stroke="#8A4CFF"/>

    <text x="335"
          y="50"
          class="label">
        ENTERPRISE AI
    </text>

    <rect x="480"
          y="52"
          width="170"
          height="46"
          rx="10"
          fill="#111833"
          stroke="#D765FF"/>

    <text x="565"
          y="80"
          class="label">
        DIGITAL SYSTEMS
    </text>

    <rect x="700"
          y="37"
          width="170"
          height="46"
          rx="10"
          fill="#111833"
          stroke="#5AE7FF"/>

    <text x="785"
          y="65"
          class="label">
        SYSTEMS THINKING
    </text>

</g>

</svg>
