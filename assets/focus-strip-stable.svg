<svg width="900" height="90" viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg">

<defs>

    <!-- Moving Background -->
    <linearGradient id="movingGlow" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#080A1F"/>
        <stop offset="35%" stop-color="#1A2260"/>
        <stop offset="50%" stop-color="#2A3DA5"/>
        <stop offset="65%" stop-color="#1A2260"/>
        <stop offset="100%" stop-color="#080A1F"/>
    </linearGradient>

    <!-- Shine Effect -->
    <linearGradient id="shine" x1="0%" x2="100%">
        <stop offset="0%" stop-color="white" stop-opacity="0"/>
        <stop offset="50%" stop-color="#5AE7FF" stop-opacity="1"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Purple Glow -->
    <filter id="purpleGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#8A4CFF"/>
    </filter>

    <!-- Pink Glow -->
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#D765FF"/>
    </filter>

    <!-- Cyan Glow -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#5AE7FF"/>
    </filter>

    <style>
        .label {
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 12px;
            font-weight: 700;
            fill: #F7F6FA;
            text-anchor: middle;
        }

        .box {
            fill: #111833;
            stroke-width: 1.5;
        }

        .automation { stroke: #5638D6; }
        .ai { stroke: #8A4CFF; }
        .digital { stroke: #D765FF; }
        .systems { stroke: #5AE7FF; }
    </style>

</defs>

<!-- Background -->
<rect width="900" height="90" rx="18" fill="#080A1F"/>

<!-- Slow Animated Glow -->
<g>
    <rect x="-300"
          y="0"
          width="1500"
          height="90"
          rx="18"
          fill="url(#movingGlow)"
          opacity="0.40">
        <animateTransform
            attributeName="transform"
            type="translate"
            values="-150 0;150 0;-150 0"
            dur="30s"
            repeatCount="indefinite"/>
    </rect>
</g>

<!-- Premium Light Sweep -->
<rect x="-200"
      y="0"
      width="120"
      height="90"
      fill="url(#shine)"
      opacity="0.08">
    <animate
        attributeName="x"
        values="-200;980"
        dur="14s"
        repeatCount="indefinite"/>
</rect>

<!-- Outer Border -->
<rect x="1"
      y="1"
      width="898"
      height="88"
      rx="18"
      fill="none"
      stroke="#2A3270"
      stroke-width="1.5"/>

<!-- Bottom Accent Line -->
<line x1="40"
      y1="78"
      x2="860"
      y2="78"
      stroke="#26306D"
      stroke-width="1"/>

<!-- Capability Boxes -->
<g>

    <g transform="translate(20 25)" filter="url(#purpleGlow)">
        <rect class="box automation"
              width="200"
              height="40"
              rx="8"/>
        <text class="label" x="100" y="25">
            INTELLIGENT AUTOMATION
        </text>
    </g>

    <g transform="translate(220 25)" filter="url(#purpleGlow)">
        <rect class="box ai"
              width="190"
              height="40"
              rx="8"/>
        <text class="label" x="95" y="25">
            ENTERPRISE AI
        </text>
    </g>

    <g transform="translate(410 25)" filter="url(#pinkGlow)">
        <rect class="box digital"
              width="190"
              height="40"
              rx="8"/>
        <text class="label" x="95" y="25">
            DIGITAL SYSTEMS
        </text>
    </g>

    <g transform="translate(600 25)" filter="url(#cyanGlow)">
        <rect class="box systems"
              width="220"
              height="40"
              rx="8"/>
        <text class="label" x="110" y="25">
            SYSTEMS THINKING
        </text>
    </g>

</g>

</svg>
