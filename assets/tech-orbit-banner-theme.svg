<svg width="1200" height="370" viewBox="0 0 1200 370" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="370">
    <stop stop-color="#040515"/><stop offset="1" stop-color="#18144E"/>
  </linearGradient>
</defs>
<rect width="1200" height="370" rx="26" fill="url(#bg)" stroke="#4636A3" stroke-opacity=".65"/>
<text x="44" y="50" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">TECH ORBIT // THE STACK IS ALIVE</text>

<g transform="translate(600 192)">
  <circle r="72" fill="#4636A3" stroke="#B67CDA" stroke-width="2"/>
  <text text-anchor="middle" y="-5" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">AUTOMATION</text>
  <text text-anchor="middle" y="21" fill="#F7F6FA" font-family="Consolas,monospace" font-size="12">CORE</text>

  <circle r="118" fill="none" stroke="#7450CA" stroke-opacity=".7" stroke-dasharray="5 13"/>
  <circle r="158" fill="none" stroke="#282179" stroke-opacity=".8" stroke-dasharray="6 15"/>

  <g>
    <g transform="translate(118 0)"><circle r="30" fill="#0A0A2A" stroke="#7450CA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="11">UiPath</text></g>
    <g transform="translate(-118 0)"><circle r="30" fill="#0A0A2A" stroke="#7450CA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">Power Apps</text></g>
    <g transform="translate(0 118)"><circle r="30" fill="#0A0A2A" stroke="#B67CDA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">Dataverse</text></g>
    <g transform="translate(0 -118)"><circle r="30" fill="#0A0A2A" stroke="#B67CDA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">Copilot</text></g>
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="28s" repeatCount="indefinite"/>
  </g>

  <g>
    <g transform="translate(158 0)"><circle r="25" fill="#18144E" stroke="#B67CDA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">Azure</text></g>
    <g transform="translate(-158 0)"><circle r="25" fill="#18144E" stroke="#B67CDA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">AWS</text></g>
    <g transform="translate(0 158)"><circle r="25" fill="#18144E" stroke="#7450CA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">APIs</text></g>
    <g transform="translate(0 -158)"><circle r="25" fill="#18144E" stroke="#7450CA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">AI</text></g>
    <animateTransform attributeName="transform" type="rotate" values="360;0" dur="36s" repeatCount="indefinite"/>
