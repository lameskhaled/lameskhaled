<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">
<defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430">
        <stop stop-color="#040515"/>
        <stop offset="1" stop-color="#15133E"/>
    </linearGradient>

    <!-- Main Accent Gradient -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#5638D6"/>
        <stop offset=".55" stop-color="#8A4CFF"/>
        <stop offset="1" stop-color="#D765FF"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="gl">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <!-- Star Pattern -->
    <pattern id="stars" width="100" height="75" patternUnits="userSpaceOnUse">
        <circle cx="18" cy="14" r="1" fill="#FFF" opacity=".5"/>
        <circle cx="71" cy="43" r=".9" fill="#5AE7FF" opacity=".4"/>
        <circle cx="88" cy="16" r=".8" fill="#FFF" opacity=".35"/>
        <circle cx="30" cy="60" r=".8" fill="#5AE7FF" opacity=".25"/>
    </pattern>

</defs>

<!-- Background -->
<rect width="1200" height="430" rx="22" fill="url(#bg)" stroke="#5638D6"/>
<rect width="1200" height="430" rx="22" fill="url(#stars)"/>

<!-- Connector Base Lines -->
<g fill="none" stroke="#2B275F" stroke-width="2">
    <path d="M150 210H340"/>
    <path d="M460 210H620"/>
    <path d="M740 210H900"/>
    <path d="M1020 210H1100"/>
</g>

<!-- Animated Flow -->
<g fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" filter="url(#gl)">
    <path d="M150 210H340" stroke-dasharray="12 22">
        <animate attributeName="stroke-dashoffset" values="0;-68" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M460 210H620" stroke-dasharray="12 22">
        <animate attributeName="stroke-dashoffset" values="0;-68" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M740 210H900" stroke-dasharray="12 22">
        <animate attributeName="stroke-dashoffset" values="0;-68" dur="1.9s" repeatCount="indefinite"/>
    </path>
    <path d="M1020 210H1100" stroke-dasharray="12 22">
        <animate attributeName="stroke-dashoffset" values="0;-68" dur="1.7s" repeatCount="indefinite"/>
    </path>
</g>

<!-- Cards -->
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">

    <!-- USER -->
    <g transform="translate(70 145)">
        <rect width="160" height="130" rx="18" fill="#0B0A22" stroke="#5638D6"/>
        <text x="80" y="47" fill="#F7F6FA" font-size="17" font-weight="700">USER</text>
        <text x="80" y="78" fill="#CFC8E8" font-size="13">Experience</text>
        <text x="80" y="103" fill="#8A4CFF" font-size="12">intent · need</text>
    </g>

    <!-- AI -->
    <g transform="translate(340 145)">
        <rect width="120" height="130" rx="18" fill="#0B0A22" stroke="#8A4CFF"/>
        <text x="60" y="47" fill="#F7F6FA" font-size="17" font-weight="700">AI</text>
        <text x="60" y="78" fill="#CFC8E8" font-size="13">Copilot</text>
        <text x="60" y="103" fill="#8A4CFF" font-size="12">reason</text>
    </g>

    <!-- DATA -->
    <g transform="translate(620 145)">
        <rect width="120" height="130" rx="18" fill="#0B0A22" stroke="#D765FF"/>
        <text x="60" y="47" fill="#F7F6FA" font-size="17" font-weight="700">DATA</text>
        <text x="60" y="78" fill="#CFC8E8" font-size="13">Knowledge</text>
        <text x="60" y="103" fill="#D765FF" font-size="12">context</text>
    </g>

    <!-- AUTO -->
    <g transform="translate(900 145)">
        <rect width="120" height="130" rx="18" fill="#0B0A22" stroke="#5AE7FF"/>
        <text x="60" y="47" fill="#F7F6FA" font-size="17" font-weight="700">AUTO</text>
        <text x="60" y="78" fill="#CFC8E8" font-size="13">Orchestrate</text>
        <text x="60" y="103" fill="#5AE7FF" font-size="12">act</text>
    </g>

    <!-- IMPACT -->
    <g transform="translate(1100 165)">
        <circle cx="38" cy="45" r="38" fill="#0B0A22" stroke="#5AE7FF"/>
        <text x="38" y="41" fill="#F7F6FA" font-size="14" font-weight="700">IMPACT</text>
        <text x="38" y="61" fill="#CFC8E8" font-size="10">LIVE</text>
    </g>

</g>

<!-- Moving Data Particles -->
<g fill="#5AE7FF" filter="url(#gl)">
    <circle cx="150" cy="210" r="4">
        <animate attributeName="cx" values="150;340" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="460" cy="210" r="4">
        <animate attributeName="cx" values="460;620" dur="2.1s" repeatCount="indefinite"/>
    </circle>

    <circle cx="740" cy="210" r="4">
        <animate attributeName="cx" values="740;900" dur="1.9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1020" cy="210" r="4">
        <animate attributeName="cx" values="1020;1100" dur="1.7s" repeatCount="indefinite"/>
    </circle>
</g>

<!-- Footer Status -->
<g font-family="Consolas,monospace" font-size="12" fill="#8F97B2">
    <text x="42" y="390">status: operational</text>
    <text x="260" y="390">latency: optimized</text>
    <text x="495" y="390">governance: enabled</text>
    <text x="770" y="390">exceptions: handled</text>
    <text x="1010" y="390" fill="#5AE7FF">● healthy</text>
</g>

</svg>
