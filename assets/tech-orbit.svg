<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">

<defs>

    <!-- Cosmic Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340">
        <stop stop-color="#040515"/>
        <stop offset="1" stop-color="#15133E"/>
    </linearGradient>

    <!-- Neon Gradient -->
    <linearGradient id="g" x1="0" x2="1">
        <stop stop-color="#5638D6"/>
        <stop offset=".55" stop-color="#8A4CFF"/>
        <stop offset="1" stop-color="#D765FF"/>
    </linearGradient>

    <!-- Neon Glow -->
    <filter id="gl">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <!-- Stars -->
    <pattern id="stars" width="100" height="75" patternUnits="userSpaceOnUse">
        <circle cx="18" cy="14" r="1" fill="#FFF" opacity=".5"/>
        <circle cx="71" cy="43" r=".9" fill="#5AE7FF" opacity=".4"/>
        <circle cx="88" cy="16" r=".8" fill="#FFF" opacity=".35"/>
        <circle cx="30" cy="60" r=".8" fill="#5AE7FF" opacity=".25"/>
    </pattern>

</defs>

<!-- Frame -->
<rect width="1200" height="340" rx="22" fill="url(#bg)"/>
<rect width="1200" height="340" rx="22" fill="url(#stars)"/>
<rect x="12" y="12" width="1176" height="316" rx="18"
      fill="none" stroke="url(#g)" stroke-width="2"/>

<!-- Orbit System -->
<g transform="translate(600 170)">

    <!-- Core -->
    <circle r="62" fill="#0B0A22" stroke="#8A4CFF" stroke-width="2"/>

    <!-- Orbit Guides -->
    <circle r="104" fill="none" stroke="#2B275F"
            stroke-width="1.5" stroke-dasharray="4 9"/>
    <circle r="142" fill="none" stroke="#2B275F"
            stroke-width="1.5" stroke-dasharray="4 10"/>

    <!-- Neon Ring -->
    <circle r="62"
            fill="none"
            stroke="url(#g)"
            stroke-width="2.5"
            stroke-dasharray="8 15"
            filter="url(#gl)">
        <animateTransform
            attributeName="transform"
            type="rotate"
            values="0;360"
            dur="8s"
            repeatCount="indefinite"/>
    </circle>

    <text text-anchor="middle"
          y="-5"
          fill="#F7F6FA"
          font-family="Segoe UI,Arial,sans-serif"
          font-size="17"
          font-weight="700">AUTOMATION</text>

    <text text-anchor="middle"
          y="20"
          fill="#CFC8E8"
          font-family="Consolas,monospace"
          font-size="12">CORE</text>

    <!-- Inner Orbit -->
    <g id="inner">

        <g transform="translate(104 0)">
            <circle r="28" fill="#0B0A22" stroke="#5638D6"/>
            <text text-anchor="middle" y="5"
                  fill="#F7F6FA"
                  font-family="Segoe UI,Arial"
                  font-size="11">UiPath</text>
        </g>

        <g transform="translate(-104 0)">
            <circle r="28" fill="#0B0A22" stroke="#8A4CFF"/>
            <text text-anchor="middle" y="5"
                  fill="#F7F6FA"
                  font-family="Segoe UI,Arial"
                  font-size="11">Power Apps</text>
        </g>

        <g transform="translate(0 104)">
            <circle r="28" fill="#0B0A22" stroke="#D765FF"/>
            <text text-anchor="middle" y="5"
                  fill="#F7F6FA"
                  font-family="Segoe UI,Arial"
                  font-size="11">Dataverse</text>
        </g>

        <g transform="translate(0 -104)">
            <circle r="28" fill="#0B0A22" stroke="#5AE7FF"/>
            <text text-anchor="middle" y="5"
                  fill="#F7F6FA"
                  font-family="Segoe UI,Arial"
                  font-size="11">Copilot</text>
        </g>

        <animateTransform
            attributeName="transform"
            type="rotate"
            values="0;360"
            dur="28s"
            repeatCount="indefinite"/>
    </g>

    <!-- Outer Orbit -->
    <g id="outer">

        <g transform="translate(142 0)">
            <circle r="24" fill="#0B0A22" stroke="#5AE7FF"/>
            <text text-anchor="middle" y="4"
                  fill="#F7F6FA"
                  font-family="Segoe UI,Arial"
                  font-size="10">Azure</text>
        </g>

        <g transform="translate(-142 0)">
            <circle r="24" fill="#0B0A22" stroke="#D765FF"/>
            <text text-anchor="middle" y="4"
                  fill="#F7F6FA"
                  font-family="Segoe UI,Arial"
                  font-size="10">AWS</text>
        </g>

        <g transform="translate(0 142)">
            <circle r="24" fill="#0B0A22" stroke="#8A4CFF"/>
            <text text-anchor="middle" y="4"
                  fill="#F7F6FA"
                  font-family="Segoe UI,Arial"
                  font-size="10">APIs</text>
        </g>

        <g transform="translate(0 -142)">
            <circle r="24" fill="#0B0A22" stroke="#5AE7FF"/>
            <text text-anchor="middle" y="4"
                  fill="#F7F6FA"
                  font-family="Segoe UI,Arial"
                  font-size="10">AI</text>
        </g>

        <animateTransform
            attributeName="transform"
            type="rotate"
            values="360;0"
            dur="36s"
            repeatCount="indefinite"/>
    </g>

</g>

<!-- Labels -->
<g font-family="Consolas,monospace" font-size="12">

    <text x="52" y="55"
          fill="#8A4CFF">STACK.ORBIT // LIVE</text>

    <text x="52" y="82"
          fill="#9AA0BF">tools move around one principle:</text>

    <text x="52" y="108"
          fill="#F7F6FA">business outcome first.</text>

    <text x="950" y="290"
          fill="#9AA0BF">signal</text>

    <circle cx="1010"
            cy="286"
            r="4"
            fill="#5AE7FF"
            filter="url(#gl)">
        <animate attributeName="opacity"
                 values=".2;1;.2"
                 dur="1.3s"
                 repeatCount="indefinite"/>
    </circle>

    <text x="1025"
          y="290"
          fill="#5AE7FF">online</text>

</g>

</svg>
