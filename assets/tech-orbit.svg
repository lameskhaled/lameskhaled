<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340"><stop stop-color="#07040D"/><stop offset="1" stop-color="#120921"/></linearGradient>
 <filter id="gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="340" rx="22" fill="url(#bg)" stroke="#2A2044"/>
<g transform="translate(600 170)">
 <circle r="62" fill="#1A0F2D" stroke="#8B5CF6" stroke-width="2"/>
 <circle r="104" fill="none" stroke="#2A2044" stroke-width="1.5" stroke-dasharray="4 9"/>
 <circle r="142" fill="none" stroke="#2A2044" stroke-width="1.5" stroke-dasharray="4 10"/>
 <circle r="62" fill="none" stroke="#E879F9" stroke-width="2" stroke-dasharray="8 15" filter="url(#gl)">
   <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
 </circle>
 <text text-anchor="middle" y="-5" fill="#F7F5FF" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">AUTOMATION</text>
 <text text-anchor="middle" y="20" fill="#C7B8FF" font-family="Consolas,monospace" font-size="12">CORE</text>

 <g id="inner">
   <g transform="translate(104 0)"><circle r="28" fill="#120B21" stroke="#8B5CF6"/><text text-anchor="middle" y="5" fill="#F7F5FF" font-family="Segoe UI,Arial,sans-serif" font-size="11">UiPath</text></g>
   <g transform="translate(-104 0)"><circle r="28" fill="#120B21" stroke="#8B5CF6"/><text text-anchor="middle" y="5" fill="#F7F5FF" font-family="Segoe UI,Arial,sans-serif" font-size="11">Power Apps</text></g>
   <g transform="translate(0 104)"><circle r="28" fill="#120B21" stroke="#C7B8FF"/><text text-anchor="middle" y="5" fill="#F7F5FF" font-family="Segoe UI,Arial,sans-serif" font-size="11">Dataverse</text></g>
   <g transform="translate(0 -104)"><circle r="28" fill="#120B21" stroke="#C7B8FF"/><text text-anchor="middle" y="5" fill="#F7F5FF" font-family="Segoe UI,Arial,sans-serif" font-size="11">Copilot</text></g>
   <animateTransform attributeName="transform" type="rotate" values="0;360" dur="28s" repeatCount="indefinite"/>
 </g>

 <g id="outer">
   <g transform="translate(142 0)"><circle r="24" fill="#120B21" stroke="#E879F9"/><text text-anchor="middle" y="4" fill="#F7F5FF" font-family="Segoe UI,Arial,sans-serif" font-size="10">Azure</text></g>
   <g transform="translate(-142 0)"><circle r="24" fill="#120B21" stroke="#E879F9"/><text text-anchor="middle" y="4" fill="#F7F5FF" font-family="Segoe UI,Arial,sans-serif" font-size="10">AWS</text></g>
   <g transform="translate(0 142)"><circle r="24" fill="#120B21" stroke="#E879F9"/><text text-anchor="middle" y="4" fill="#F7F5FF" font-family="Segoe UI,Arial,sans-serif" font-size="10">APIs</text></g>
   <g transform="translate(0 -142)"><circle r="24" fill="#120B21" stroke="#E879F9"/><text text-anchor="middle" y="4" fill="#F7F5FF" font-family="Segoe UI,Arial,sans-serif" font-size="10">AI</text></g>
   <animateTransform attributeName="transform" type="rotate" values="360;0" dur="36s" repeatCount="indefinite"/>
 </g>
</g>
<g font-family="Consolas,monospace" font-size="12">
 <text x="52" y="55" fill="#C7B8FF">STACK.ORBIT // LIVE</text>
 <text x="52" y="82" fill="#7A7391">tools move around one principle:</text>
 <text x="52" y="108" fill="#F7F5FF">business outcome first.</text>
 <text x="950" y="290" fill="#7A7391">signal</text>
 <circle cx="1010" cy="286" r="4" fill="#E879F9"><animate attributeName="opacity" values=".2;1;.2" dur="1.3s" repeatCount="indefinite"/></circle>
 <text x="1025" y="290" fill="#34D399">online</text>
</g>
</svg>