<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420">
    <stop stop-color="#040515"/><stop offset=".55" stop-color="#18144E"/><stop offset="1" stop-color="#282179"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" x2="1">
