  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="26" fill="url(#bg)" stroke="#4636A3" stroke-opacity=".7"/>
<text x="44" y="50" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">SYSTEM MAP // INTELLIGENCE FLOW</text>
<text x="44" y="76" fill="#B67CDA" font-family="Consolas,monospace" font-size="12">business intent → intelligence → data → automation → measurable impact</text>

