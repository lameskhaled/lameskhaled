<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420">
    <stop stop-color="#040515"/><stop offset=".55" stop-color="#18144E"/><stop offset="1" stop-color="#282179"/>
  </linearGradient>
  <linearGradient id="g" x1="0" x2="1">
    <stop stop-color="#4636A3"/><stop offset=".45" stop-color="#7450CA"/><stop offset=".75" stop-color="#B67CDA"/><stop offset="1" stop-color="#65DFFF"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="stars" width="110" height="80" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="18" r="1" fill="#fff" opacity=".45"/>
    <circle cx="78" cy="42" r=".9" fill="#65DFFF" opacity=".35"/>
    <circle cx="95" cy="66" r=".8" fill="#B67CDA" opacity=".35"/>
  </pattern>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)" stroke="#4636A3" stroke-opacity=".65"/>
<rect width="1200" height="420" rx="24" fill="url(#stars)"/>
<text x="42" y="48" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">SYSTEM ARCHITECTURE</text>
<text x="42" y="74" fill="#B67CDA" font-family="Consolas,monospace" font-size="12">intent → intelligence → context → automation → impact</text>

<!-- subtle scanning beam -->
<rect x="0" y="0" width="1200" height="2" fill="#65DFFF" opacity=".22">
  <animate attributeName="y" values="95;340;95" dur="7s" repeatCount="indefinite"/>
</rect>

<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
  <g transform="translate(55 145)">
    <rect width="175" height="140" rx="20" fill="#0B0A20" stroke="#4636A3">
      <animate attributeName="stroke-opacity" values=".55;1;.55" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="87" y="48" fill="#F7F6FA" font-size="18" font-weight="700">USER</text>
    <text x="87" y="78" fill="#B67CDA" font-size="13">experience</text>
    <text x="87" y="104" fill="#7450CA" font-size="12">intent</text>
  </g>
  <g transform="translate(305 145)">
    <rect width="150" height="140" rx="20" fill="#0B0A20" stroke="#7450CA">
      <animate attributeName="stroke-opacity" values=".55;1;.55" dur="3.7s" begin=".4s" repeatCount="indefinite"/>
    </rect>
    <text x="75" y="48" fill="#F7F6FA" font-size="18" font-weight="700">AI</text>
    <text x="75" y="78" fill="#B67CDA" font-size="13">reason</text>
    <text x="75" y="104" fill="#7450CA" font-size="12">assist</text>
  </g>
  <g transform="translate(535 145)">
    <rect width="150" height="140" rx="20" fill="#0B0A20" stroke="#B67CDA">
      <animate attributeName="stroke-opacity" values=".55;1;.55" dur="4s" begin=".8s" repeatCount="indefinite"/>
    </rect>
    <text x="75" y="48" fill="#F7F6FA" font-size="18" font-weight="700">DATA</text>
    <text x="75" y="78" fill="#B67CDA" font-size="13">context</text>
    <text x="75" y="104" fill="#7450CA" font-size="12">knowledge</text>
  </g>
  <g transform="translate(765 145)">
    <rect width="150" height="140" rx="20" fill="#0B0A20" stroke="#7450CA">
      <animate attributeName="stroke-opacity" values=".55;1;.55" dur="4.3s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="75" y="48" fill="#F7F6FA" font-size="18" font-weight="700">AUTO</text>
    <text x="75" y="78" fill="#B67CDA" font-size="13">orchestrate</text>
    <text x="75" y="104" fill="#7450CA" font-size="12">execute</text>
  </g>
  <g transform="translate(1000 158)">
    <circle cx="62" cy="56" r="53" fill="#4636A3" stroke="#B67CDA" filter="url(#glow)">
      <animate attributeName="r" values="50;56;50" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="62" y="52" fill="#F7F6FA" font-size="15" font-weight="700">IMPACT</text>
    <text x="62" y="73" fill="#79F2B3" font-size="11">LIVE</text>
  </g>
</g>

<!-- animated connections -->
<g stroke="url(#g)" stroke-width="3" fill="none" filter="url(#glow)" stroke-linecap="round">
  <path d="M230 215H305" stroke-dasharray="10 15"><animate attributeName="stroke-dashoffset" values="0;-50" dur="1.5s" repeatCount="indefinite"/></path>
  <path d="M455 215H535" stroke-dasharray="10 15"><animate attributeName="stroke-dashoffset" values="0;-50" dur="1.7s" repeatCount="indefinite"/></path>
  <path d="M685 215H765" stroke-dasharray="10 15"><animate attributeName="stroke-dashoffset" values="0;-50" dur="1.9s" repeatCount="indefinite"/></path>
  <path d="M915 215H1000" stroke-dasharray="10 15"><animate attributeName="stroke-dashoffset" values="0;-50" dur="2.1s" repeatCount="indefinite"/></path>
</g>

<!-- moving data packets -->
<g fill="#65DFFF" filter="url(#glow)">
  <circle r="4"><animateMotion dur="1.5s" repeatCount="indefinite" path="M230 215 H305"/></circle>
  <circle r="4"><animateMotion dur="1.7s" repeatCount="indefinite" path="M455 215 H535"/></circle>
  <circle r="4"><animateMotion dur="1.9s" repeatCount="indefinite" path="M685 215 H765"/></circle>
  <circle r="4"><animateMotion dur="2.1s" repeatCount="indefinite" path="M915 215 H1000"/></circle>
</g>

<!-- lower telemetry -->
<path d="M60 340 C170 310,245 360,350 332 S520 310,625 342 S805 365,930 330 S1060 312,1140 338"
      fill="none" stroke="url(#g)" stroke-width="2" opacity=".75" stroke-dasharray="12 18">
  <animate attributeName="stroke-dashoffset" values="0;-120" dur="5s" repeatCount="indefinite"/>
</path>
</svg>