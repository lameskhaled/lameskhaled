<svg width="1200" height="370" viewBox="0 0 1200 370" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="370">
    <stop stop-color="#040515"/><stop offset="1" stop-color="#18144E"/>
  </linearGradient>
  <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="370" rx="24" fill="url(#bg)" stroke="#4636A3" stroke-opacity=".65"/>
<text x="42" y="48" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">TECH ORBIT</text>

<g transform="translate(600 194)">
  <circle r="72" fill="#4636A3" stroke="#B67CDA" stroke-width="2" filter="url(#gl)">
    <animate attributeName="r" values="68;74;68" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text text-anchor="middle" y="-5" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">AUTOMATION</text>
  <text text-anchor="middle" y="20" fill="#CEC7E6" font-family="Consolas,monospace" font-size="11">CORE</text>

  <circle r="118" fill="none" stroke="#7450CA" stroke-opacity=".7" stroke-dasharray="5 13">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle r="158" fill="none" stroke="#282179" stroke-opacity=".8" stroke-dasharray="6 15">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite"/>
  </circle>

  <g>
    <g transform="translate(118 0)"><circle r="30" fill="#0B0A20" stroke="#7450CA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="11">UiPath</text></g>
    <g transform="translate(-118 0)"><circle r="30" fill="#0B0A20" stroke="#7450CA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">Power Apps</text></g>
    <g transform="translate(0 118)"><circle r="30" fill="#0B0A20" stroke="#B67CDA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">Dataverse</text></g>
    <g transform="translate(0 -118)"><circle r="30" fill="#0B0A20" stroke="#B67CDA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">Copilot</text></g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
  </g>

  <g>
    <g transform="translate(158 0)"><circle r="25" fill="#18144E" stroke="#65DFFF"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">Azure</text></g>
    <g transform="translate(-158 0)"><circle r="25" fill="#18144E" stroke="#65DFFF"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">AWS</text></g>
    <g transform="translate(0 158)"><circle r="25" fill="#18144E" stroke="#7450CA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">APIs</text></g>
    <g transform="translate(0 -158)"><circle r="25" fill="#18144E" stroke="#7450CA"/><text text-anchor="middle" y="4" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="10">AI</text></g>
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="27s" repeatCount="indefinite"/>
  </g>

  <!-- orbiting telemetry point -->
  <circle r="5" fill="#65DFFF" filter="url(#gl)">
    <animateMotion dur="5s" repeatCount="indefinite"
      path="M158,0 A158,158 0 1,1 -158,0 A158,158 0 1,1 158,0"/>
  </circle>
</g>
</svg>