<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" x2="1200"><stop stop-color="#040515"/><stop offset="1" stop-color="#18144E"/></linearGradient>
  <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="340" rx="24" fill="url(#bg)" stroke="#4636A3" stroke-opacity=".65"/>
<text x="42" y="48" fill="#F7F6FA" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">MISSION CONTROL</text>

<g font-family="Segoe UI,Arial,sans-serif">
  <g transform="translate(44 82)">
    <circle cx="16" cy="16" r="11" fill="#4636A3" filter="url(#gl)"><animate attributeName="r" values="9;12;9" dur="2.7s" repeatCount="indefinite"/></circle>
    <text x="42" y="21" fill="#F7F6FA" font-size="17" font-weight="700">Automation First</text>
    <text x="42" y="48" fill="#CEC7E6" font-size="12">Automate repetitive work so people can focus on what matters.</text>
  </g>
  <g transform="translate(44 145)">
    <circle cx="16" cy="16" r="11" fill="#7450CA" filter="url(#gl)"><animate attributeName="r" values="9;12;9" dur="3s" begin=".5s" repeatCount="indefinite"/></circle>
    <text x="42" y="21" fill="#F7F6FA" font-size="17" font-weight="700">AI + Human Intelligence</text>
    <text x="42" y="48" fill="#CEC7E6" font-size="12">Blend AI capability with human insight to create stronger outcomes.</text>
  </g>
  <g transform="translate(44 208)">
    <circle cx="16" cy="16" r="11" fill="#B67CDA" filter="url(#gl)"><animate attributeName="r" values="9;12;9" dur="3.3s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="42" y="21" fill="#F7F6FA" font-size="17" font-weight="700">Scalable &amp; Secure</text>
    <text x="42" y="48" fill="#CEC7E6" font-size="12">Build solutions that scale with the business and protect what matters.</text>
  </g>

  <g transform="translate(650 82)">
    <circle cx="16" cy="16" r="11" fill="#65DFFF" filter="url(#gl)"><animate attributeName="r" values="9;12;9" dur="2.9s" begin=".8s" repeatCount="indefinite"/></circle>
    <text x="42" y="21" fill="#F7F6FA" font-size="17" font-weight="700">Impact Driven</text>
    <text x="42" y="48" fill="#CEC7E6" font-size="12">Measure success by value delivered, not by tool count.</text>
  </g>
  <g transform="translate(650 145)">
    <circle cx="16" cy="16" r="11" fill="#7450CA" filter="url(#gl)"><animate attributeName="r" values="9;12;9" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <text x="42" y="21" fill="#F7F6FA" font-size="17" font-weight="700">Business First</text>
    <text x="42" y="48" fill="#CEC7E6" font-size="12">Start with the outcome and experience — then choose the technology.</text>
  </g>
  <g transform="translate(650 208)">
    <circle cx="16" cy="16" r="11" fill="#4636A3" filter="url(#gl)"><animate attributeName="r" values="9;12;9" dur="3.5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <text x="42" y="21" fill="#F7F6FA" font-size="17" font-weight="700">Own the Outcome</text>
    <text x="42" y="48" fill="#CEC7E6" font-size="12">Scope, build, test, deploy, investigate and improve.</text>
  </g>
</g>

<rect x="42" y="302" width="1116" height="2" fill="#7450CA" opacity=".35"/>
<rect x="42" y="302" width="150" height="2" fill="#65DFFF">
  <animate attributeName="x" values="42;1008;42" dur="5.5s" repeatCount="indefinite"/>
</rect>
</svg>