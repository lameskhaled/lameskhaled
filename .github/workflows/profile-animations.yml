name: Generate profile animations

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate arcade contribution games
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout,galaga"
          hide_month_labels: "false"

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E879F9&color_dots=%23ebedf0,%23ddd6fe,%23c4b5fd,%238b5cf6,%236d28d9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23E879F9&color_dots=%230A0712,%232A2044,%236D28D9,%238B5CF6,%23C7B8FF

      - name: Publish every animation together
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
